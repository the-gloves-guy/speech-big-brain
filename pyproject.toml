[project]
name = "lid-phase-i"
version = "0.1.0"
description = "Closed-set VoxLingua107 adaptation and FLEURS calibration experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "speechbrain==1.0.3",
  "huggingface-hub>=0.25,<1",
  "datasets>=3.6,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "soundfile>=0.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "silero-vad==6.2.3",
  "umap-learn==0.5.9.post2",
  "openai-whisper==20250625",
]

[project.scripts]
lid = "lid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lid"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
