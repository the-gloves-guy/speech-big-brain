[project]
name = "speaker-embedding-pilot"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyannote.audio==3.3.2", "torch==2.5.1", "torchaudio==2.5.1",
  "numpy==1.26.4", "speechbrain==1.0.3", "silero-vad==6.2.3",
  "huggingface-hub>=0.25,<1", "pyannote.core>=5,<6",
  "pyannote.database>=5,<6", "pyannote.metrics>=3.2,<4",
  "pyannote.pipeline>=3,<4", "torchmetrics>=1.4,<1.6",
  "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4",
  "pytest>=8,<9", "torchvision==0.20.1",
]
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
